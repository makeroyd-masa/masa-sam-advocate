# ============================================================================
# config/pos_facility_map.yaml  |  v0.1
# Encounter Place-of-Service → which PFS rate column to benchmark against
# (PRD §6.2). This is the CMS PE-RVU facility/non-facility rule — NOT stored in
# pilot.db, so it lives here as config.
#   facility      -> physician_fee_schedule.fac_rate
#   non_facility  -> physician_fee_schedule.non_fac_rate
# Unlisted POS codes fall back to `default`. POS values are TEXT (match codes.code).
# ============================================================================
version: "0.1"
default: non_facility

facility:
