# ============================================================================
# config/carc_rarc_plain_english.yaml  |  v0.1  (routing skeleton)
# SAM Medical Bill Advocate — §5 CARC/RARC plain-English + routing layer.
#
# WHAT THIS FILE IS
#   The hand-authored, review-gated translation/routing asset (PRD §5.2/§5.3).
#   Loaded on deploy into app.db `code_explanations` for fast joins.
#
# DIVISION OF LABOR (PRD §5.3)
#   * ROUTING fields below — suggested_action, commonly_disputable, rank_frequency
#     — are populated and ready for the router. These are semantics-driven.
#   * MEMBER-FACING COPY — plain_explanation, practical_meaning — is intentionally
#     left blank ("") for the content team to author and review. Do NOT auto-fill.
#   * official_text is NOT stored here; the loader joins it from pilot.db on `code`.
#
# RANKING BASIS
#   rank_frequency is within code_type (CARC 1–50, RARC 1–30). The head is grounded
#   in the established revenue-cycle frequency literature (denial indices); the tail
#   is standard high-volume codes. Re-validate against a live published source or
#   MASA's own denial data before locking — only the ORDER changes, not the routing.
#
# suggested_action ENUM (the router; PRD §5.2)
#   explain_only       -> stays in Flow 1 (legitimate / informational)
#   error_check        -> Flow 2 (likely recoverable coding/quantity/bundling error)
#   appeal             -> Flow 3 (medical-necessity / procedural appeal basis)
#   verify_with_payer  -> off-ramp: resubmit / supply info / coordinate benefits
#   escalate_human     -> in-house advocate handoff
#
# ROUTING TAXONOMY (semantic bucket -> default action)
#   missing/incomplete info ............ verify_with_payer (error_check if coding gap)
#   authorization / precert absent ..... appeal
#   medical necessity / experimental ... appeal
#   bundling / included / sequencing ... error_check
#   duplicate claim/service ............ error_check
#   quantity / frequency exceeds ....... error_check (MUE)
#   coding inconsistency (dx/px/mod) ... error_check
#   coordination of benefits / wrong payer  verify_with_payer
#   coverage terminated / not eligible . verify_with_payer
#   patient cost-share (ded/coins/copay) explain_only
#   contractual adjustment / benefit max explain_only
#   timely filing ...................... verify_with_payer (escalate if member harmed)
# ============================================================================

version: "0.1"
rank_scope: "within_code_type"   # CARC 1-50, RARC 1-30

