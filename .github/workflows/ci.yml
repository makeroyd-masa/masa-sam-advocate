name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # The real 1 GB pilot.db is not present in CI, so the Tier A fixture suite
      # runs the engine against the committed slim tests/fixtures/ci_pilot.db.
      # DB-dependent engine tests (test_pilot/flow*/router/intake) skip in CI;
      # they run locally where the full pilot.db is available.
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend build (tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
